include:
  - project: 'inwoker/tgs/tgs-gitlab-ci-jobs'
    ref: main
    file: '/templates/.lobby-deployment.yaml'

variables:
  ImageName: pgtgs/lobby-t2
  
build:
  extends: .build
  variables:
    Submodule_Branch: master
    Wap_Submodule_Branch: v226
  only:
    - v226

deploy-prod-v226:
  extends: .deploy-k8s-prod
  variables:
    components: "prod_t2_v226"
  only:
    - v226