include:
  - project: 'inwoker/tgs/tgs-gitlab-ci-jobs'
    ref: main
    file: '/templates/.lobby-deployment.yaml'

variables:
  ImageName: pgtgs/lobby-t2
  
build:
  extends: .build
  only:
    - master
    - release/current
    - develop


deploy-dev:
  extends: .deploy-k8s-dev
  variables:
    components: "dev_t2"

deploy-staging:
  extends: .deploy-k8s-staging_for_develop
  variables:
    components: "staging_t2"

deploy-prod:
  extends: .deploy-k8s-prod
  variables:
    components: "prod_t2"
