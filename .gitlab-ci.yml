include:
  - project: 'inwoker/tgs/tgs-gitlab-ci-jobs'
    ref: main
    file: '/templates/.lobby-deployment.yaml'

variables:
  ImageName: pgtgs/lobby-t2
  
build:
  extends: .build
  tags:
    - local-build
  variables:
    Submodule_Branch: master
  only:
    - master
    - release/current
    - develop

deploy-dev-v226:
  extends: .deploy-base
  variables:
    namespace: "dev"
    components: "dev_t2_v226"
  only:
    - dev/v226

deploy-dev:
  extends: .deploy-base
  variables:
    namespace: "dev"
    components: "dev_t2"
  only:
    - develop

deploy-staging-v226:
  extends: .deploy-base
  variables:
    namespace: "staging"
    components: "staging_t2_v226"
  only:
    - stg/v226
  when: manual
  
deploy-staging:
  extends: .deploy-base
  variables:
    namespace: "staging"
    components: "staging_t2"
  only:
    - release/current
  when: manual

deploy-prod-v226:
  extends: .deploy-base
  variables:
    namespace: "prod"
    components: "prod_t2_v226"
  only:
    - v226
  when: manual

deploy-prod:
  extends: .deploy-base
  variables:
    namespace: "prod"
    components: "prod_t2"
  only:
    - master
  when: manual