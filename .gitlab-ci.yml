include:
  - project: 'inwoker/tgs/tgs-gitlab-ci-jobs'
    ref: main
    file: '/templates/.lobby-deployment.yaml'

variables:
  ImageName: pgtgs/lobby-t2
  
build:
  extends: .build
  tags:
    - local-build
  only:
    - master
    - release/current
    - develop
    - dev/v226
    - v226

deploy-dev-v226:
  extends: .deploy-base
  variables:
    namespace: "dev"
    components: "dev_t2_v226"
  tags:
    - dev
  only:
    - dev/v226

deploy-dev:
  extends: .deploy-base
  variables:
    namespace: "dev"
    components: "dev_t2"
  tags:
    - dev
  only:
    - develop

deploy-staging-v226:
  extends: .deploy-base
  variables:
    namespace: "staging"
    components: "staging_t2_v226"
  tags:
    - staging
  only:
    - stg/v226

deploy-staging:
  extends: .deploy-base
  variables:
    namespace: "staging"
    components: "staging_t2"
  tags:
    - staging
  only:
    - release/current

deploy-prod-v226:
  extends: .deploy-base
  variables:
    namespace: "prod"
    components: "prod_t2_v226"
  tags:
    - prod
  only:
    - v226

deploy-prod:
  extends: .deploy-base
  variables:
    namespace: "prod"
    components: "prod_t2"
  tags:
    - prod
  only:
    - master