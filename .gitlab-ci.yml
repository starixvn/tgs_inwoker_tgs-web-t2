include:
  - project: 'inwoker/tgs/tgs-gitlab-ci-jobs'
    ref: main
    file: '/templates/.lobby-deployment.yaml'

variables:
  ImageName: pgtgs/lobby-t2
  
build:
  extends: .build
  variables:
    Submodule_Branch: develop
    Wap_Submodule_Branch: dev/v226
  only:
    - stg/v226
    - v226

deploy-staging-v226:
  extends: .deploy-k8s-staging
  variables:
    components: "staging_t2_v226"
  only:
    - dev/v226
