include:
  - project: 'inwoker/tgs/tgs-gitlab-ci-jobs'
    ref: main
    file: '/templates/.lobby-deployment.yaml'

variables:
  ImageName: pgtgs/lobby-t2
  
build:
  extends: .build
  variables:
    Submodule_Branch: develop
  only:
    - master
    - release/current
    - develop
    - dev/v226
    - stg/v226
    - v226

deploy-dev:
  extends: .deploy-k8s-dev
  variables:
    components: "dev_t2"

deploy-staging:
  extends: .deploy-k8s-staging
  variables:
    components: "staging_t2"

deploy-prod:
  extends: .deploy-k8s-prod
  variables:
    components: "prod_t2"

deploy-dev-v226:
  extends: .deploy-k8s-dev
  variables:
    components: "dev_t2_v226"
  only:
    - dev/v226

deploy-staging-v226:
  extends: .deploy-k8s-staging
  variables:
    components: "staging_t2_v226"
  only:
    - stg/v226

deploy-prod-v226:
  extends: .deploy-k8s-prod
  variables:
    components: "prod_t2_v226"
  only:
    - v226